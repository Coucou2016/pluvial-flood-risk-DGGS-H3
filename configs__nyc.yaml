# NYC / Manhattan — paper main study (open labels, spatial CV, adaptive H3)
#
# This config does NOT reproduce 7Analytics PFIb. Labels are public multi-source
# layers (DEP stormwater, 311, USGS Ida HWM) when present under data/raw/nyc/.
# If those files are missing, scripts/build_nyc_h3.py writes schema fixtures and
# tags assembly_mode=fixture — fixture metrics are not scientific results.
#
# Live fetch (Lower Manhattan bbox subset): python scripts\download_nyc_data.py
# or .\scripts\download_nyc_data_stub.ps1  — see data/raw/nyc/DOWNLOAD_MANIFEST.json
#
# Oslo (configs/demo_oslo.yaml) is transfer / appendix only.

name: nyc_manhattan
study_role: main
data_provenance: opendata_or_fixture
# assembly_mode in YAML is a default; build_nyc_h3.py overwrites to opendata|fixture from disk.
assembly_mode: opendata

# Extents (EPSG:4326). Major Revision Option B: paper pilot uses `lower_manhattan`
# (~262 R9 cells). Legacy `smoke` (~141 R9) retained for fast QA only.
# `manhattan_expanded` needs a separate download (--bbox-profile).
bbox_profiles:
  smoke: [-74.02, 40.70, -73.98, 40.74]  # legacy fast QA (~141 R9); not paper claim
  lower_manhattan: [-74.02, 40.70, -73.97, 40.76]  # paper pilot (~262 R9)
  # Midtown-south / Financial-District-northward expansion (optional; larger DEM fetch)
  manhattan_expanded: [-74.03, 40.68, -73.94, 40.80]
bbox: [-74.02, 40.70, -73.97, 40.76]
smoke_bbox: [-74.02, 40.70, -73.98, 40.74]
default_build_profile: lower_manhattan
default_smoke_profile: lower_manhattan
resolution: 9
random_seed: 42

# External validation + negative control are role-typed, never training labels
# (Major Revision P0-3). The legacy "include FloodNet in labels" switch was
# removed entirely; FloodNet physically cannot reach attach_training_labels.
external_validation:
  floodnet:
    role: external_validation
    events_dataset_id: aq7i-eu5q
    sensors_dataset_id: kb2e-tjy3
    analysis_freeze_utc: "2026-08-30T00:00:00+00:00"
    sensors: data/raw/nyc/floodnet_sensors.geojson

negative_control:
  sandy:
    role: negative_control
    path: data/raw/nyc/fema_sandy.geojson

rainfall_mm_h: 40.0
rainfall_scenarios:
  - name: moderate
    mm_h: 25
  - name: heavy
    mm_h: 40
  - name: ida_like
    mm_h: 75
  - name: extreme
    mm_h: 100

spatial_cv:
  # P0-6: `k_ring` was misnamed — this is a PARENT-RESOLUTION OFFSET. Offset 2 at
  # R9 gives R7 blocks (R9 − 2 = R7). Renamed `parent_resolution_offset`.
  parent_resolution_offset: 2
  n_folds: 5
  # P0-5: physical guard-band buffers (metres, EPSG:2263) for train-neighbour purge.
  buffers_m: [0, 250, 500, 1000]
  bootstrap_n: 1000

diagnostics:
  # Ladder uses fine_res for hotspot definition; train table may stay at `resolution`.
  # fine_res>=10 enables paper-style R10→R9/R8 pairs (open labels — not Svellingen PFIb 0.14).
  # Labels are overlain natively at fine_res (DEP polygons + points); no parent inheritance.
  resolutions: [8, 9, 10]
  fine_res: 10
  hotspot_quantile: 0.9

adaptive:
  coarse_res: 9
  fine_res: 11
  risk_quantile: 0.8
  uncertainty_min: 0.7
  expand_neighbors: 1

paths:
  raw_dir: data/raw/nyc
  dem: data/raw/nyc/dem.tif
  impervious: data/raw/nyc/impervious.tif
  buildings: data/raw/nyc/building_footprints.geojson
  hydro: data/raw/nyc/hydro_streams.geojson
  flood_polygons: data/raw/nyc/dep_stormwater_flood.geojson
  flood_points:
    - data/raw/nyc/flooding_311.geojson
    - data/raw/nyc/usgs_ida_hwm.geojson
  coastal: data/raw/nyc/fema_sandy.geojson  # negative control, not a training label
  event_rainfall: data/raw/nyc/event_rainfall.tif  # optional event grid hook (NOT a trained driver)

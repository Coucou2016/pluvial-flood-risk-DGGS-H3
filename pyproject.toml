[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pluvial-flood-risk-dggs-h3"
version = "0.1.0"
description = "Scalable pluvial flood risk assessment with ML and H3 DGGS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "NTNU / 7Analytics / Ostfold University College" },
]
dependencies = [
  "h3>=4.0.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyarrow>=14.0",
  "click>=8.1",
  "joblib>=1.3",
  "shapely>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
raster = ["rasterio>=1.3", "pyproj>=3.6"]
plot = ["matplotlib>=3.8", "SciencePlots>=2.1"]
dev = ["pytest>=7.4", "rasterio>=1.3", "pyproj>=3.6", "matplotlib>=3.8", "SciencePlots>=2.1"]

[project.scripts]
pluvial-demo-data = "pluvial_flood_risk.cli:generate_demo_data"
pluvial-train = "pluvial_flood_risk.cli:train"
pluvial-predict = "pluvial_flood_risk.cli:predict"
pluvial-predict-scenarios = "pluvial_flood_risk.cli:predict_scenarios"
pluvial-evaluate = "pluvial_flood_risk.cli:evaluate"
pluvial-smoke = "pluvial_flood_risk.cli:smoke"
pluvial-show-config = "pluvial_flood_risk.cli:show_config"
pluvial-diagnostics = "pluvial_flood_risk.cli:diagnostics"
pluvial-adaptive = "pluvial_flood_risk.cli:adaptive_refine"
pluvial-nyc-smoke = "pluvial_flood_risk.cli:nyc_smoke"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
